<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestione · Il Mio Shop</title>
<link rel="stylesheet" href="style.css?v=1">
<style>
  .adwrap{max-width:1000px;margin:0 auto;padding:18px}
  .login{max-width:380px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
  .tabs{display:flex;gap:8px;margin:16px 0}
  .tab{padding:10px 18px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:700;color:var(--muted)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;flex:1;min-width:140px;box-shadow:var(--shadow)}
  .stat .v{font-size:24px;font-weight:800}.stat .k{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .prow .t{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#eef0fb,#e7e9f7);overflow:hidden;display:grid;place-items:center;font-size:20px;color:#aab;flex:none}
  .prow .t img{width:100%;height:100%;object-fit:cover}
  .mini{font-size:12px;color:var(--muted)}
  .tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .tag.pending{background:#fef3c7;color:#92400e}.tag.paid{background:#dcfce7;color:#166534}.tag.shipped{background:#dbeafe;color:#1e40af}.tag.cancelled{background:#fee2e2;color:#991b1b}
  .order{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  select{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-weight:600;font-family:inherit}
  .small{padding:7px 12px;font-size:13px;border-radius:9px}
  .danger{background:#fee2e2;color:var(--bad)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="logo" style="margin-bottom:6px"><span class="dot">🛍️</span> Gestione negozio</div>
  <p class="mini" style="margin:0 0 16px">Inserisci la password admin.</p>
  <div class="field"><label>Password</label><input id="pw" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <button class="btn" onclick="doLogin()">Entra</button>
  <p id="loginErr" style="color:var(--bad);font-size:13px;margin-top:10px;display:none"></p>
  <p class="mini" style="margin-top:14px"><a href="/" style="color:var(--brand)">← Vai al negozio</a></p>
</div>

<!-- DASHBOARD -->
<div id="dash" class="adwrap" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
    <div class="logo"><span class="dot">🛍️</span> Gestione</div>
    <div style="display:flex;gap:8px"><a class="tab" href="/" target="_blank">↗ Vedi negozio</a><button class="tab" onclick="logout()">Esci</button></div>
  </div>

  <div class="stats" id="stats" style="margin-top:14px"></div>

  <div class="tabs">
    <button class="tab on" id="tabProd" onclick="showTab('prod')">📦 Prodotti</button>
    <button class="tab" id="tabOrd" onclick="showTab('ord')">🧾 Ordini <span id="ordBadge"></span></button>
  </div>

  <!-- PRODOTTI -->
  <div id="viewProd">
    <div class="panel">
      <h3 style="margin:0 0 12px" id="formTitle">➕ Aggiungi prodotto</h3>
      <input type="hidden" id="p_id">
      <div class="two">
        <div class="field"><label>Nome prodotto *</label><input id="p_name" placeholder="Es. Auricolari Bluetooth"></div>
        <div class="field"><label>Categoria</label><input id="p_category" placeholder="Telefonia" list="catlist"><datalist id="catlist"></datalist></div>
      </div>
      <div class="two">
        <div class="field"><label>Prezzo di vendita € *</label><input id="p_price" type="number" step="0.01" placeholder="29.90"></div>
        <div class="field"><label>Costo fornitore € <span class="mini">(per il margine)</span></label><input id="p_cost" type="number" step="0.01" placeholder="11.00"></div>
        <div class="field"><label>Disponibilità <span class="mini">(vuoto = illimitata)</span></label><input id="p_stock" type="number" placeholder="∞"></div>
      </div>
      <div class="field"><label>Link immagine (URL)</label><input id="p_image" placeholder="https://...jpg  (incolla il link della foto del prodotto)"></div>
      <div class="field"><label>Descrizione</label><textarea id="p_description" rows="3" placeholder="Descrizione del prodotto..."></textarea></div>
      <div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="saveProduct()">Salva prodotto</button><button class="btn ghost" id="cancelEdit" style="display:none;flex:0 0 auto;padding-left:20px;padding-right:20px" onclick="resetForm()">Annulla</button></div>
      <p id="prodMsg" class="mini" style="margin-top:8px"></p>
    </div>
    <div class="panel">
      <h3 style="margin:0 0 6px">I tuoi prodotti (<span id="prodCount">0</span>)</h3>
      <div id="prodList"></div>
    </div>
  </div>

  <!-- ORDINI -->
  <div id="viewOrd" style="display:none">
    <div class="panel">
      <h3 style="margin:0 0 6px">Ordini ricevuti</h3>
      <div id="ordList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="admin.js?v=1"></script>
</body>
</html>
