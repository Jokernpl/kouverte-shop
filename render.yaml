services:
  - type: web
    name: kouverte-shop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    # Nessuna variabile obbligatoria: il sito parte con i valori di default.
    # Aggiungi dopo dal pannello Render (Settings -> Environment) quando vuoi:
    #   STRIPE_SECRET_KEY (carte) · UPSTASH_REDIS_REST_URL + UPSTASH_REDIS_REST_TOKEN (dati permanenti) · ADMIN_PASSWORD
